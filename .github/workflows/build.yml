name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Android Project Automatically
        run: |
          mkdir -p app/src/main/java/com/example/waautosender
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          echo '' | base64 -d > settings.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4wJyBhcHBseSBmYWxzZQogICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzEuOS4yMCcgYXBwbHkgZmFsc2UKfQo=' | base64 -d > build.gradle
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCg==' | base64 -d > gradle.properties
          echo '' | base64 -d > app/build.gradle
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          echo '' | base64 -d > app/src/main/res/xml/accessibility_service_config.xml
          echo '' | base64 -d > app/src/main/res/values/strings.xml
          echo '' | base64 -d > app/src/main/res/layout/activity_main.xml
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/ScheduleRepository.kt
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/VoiceCommandParser.kt
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/BootReceiver.kt
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/WhatsAppAccessibilityService.kt
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/AlarmReceiver.kt
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/WakeUpActivity.kt
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/PinCalibratorActivity.kt
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/NotepadActivity.kt
          echo '' | base64 -d > app/src/main/java/com/example/waautosender/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA-Auto-Sender-APK
          path: app/build/outputs/apk/debug/app-debug.apk
